# Temporary: extracts reference frames from a video so the template can be recreated. Removed after use.
name: reel-frames
on:
  push:
    branches: ['arena/c0dea561-birthday']
    paths: ['.github/workflows/reel-frames.yml']
permissions:
  contents: write
jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: download + extract
        run: |
          mkdir -p _reel
          URL=$(curl -s https://api.streamable.com/videos/qxz9xo | python3 -c "import sys,json; print(json.load(sys.stdin)['files']['mp4']['url'])")
          curl -sL "$URL" -o /tmp/reel.mp4
          ls -la /tmp/reel.mp4
          mkdir -p _reel/hd && ffmpeg -loglevel error -i /tmp/reel.mp4 -vf "fps=2" -q:v 2 _reel/hd/h_%03d.jpg
          true
          ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/reel.mp4 > _reel/info.txt
          ls _reel | wc -l
      - name: commit frames
        run: |
          git config user.name "frames-bot"; git config user.email "frames-bot@users.noreply.github.com"
          git add _reel && git commit -m "temp: reel hd frames" && git push
